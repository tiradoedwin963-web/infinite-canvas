name: infinite-canvas

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    logging: *default-logging
    environment:
      LINGKE_BASE_URL: ${LINGKE_BASE_URL:?LINGKE_BASE_URL is required}
      LINGKE_API_KEY: ${LINGKE_API_KEY:?LINGKE_API_KEY is required}
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      CANVAS_BASIC_AUTH_HASH: ${CANVAS_BASIC_AUTH_HASH:?CANVAS_BASIC_AUTH_HASH is required}
    ports:
      - "3011:3011"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
